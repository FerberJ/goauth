version: "2"
sql:
  - engine: "sqlite"
    queries:
      - "store/queries/user.sql"
      - "store/queries/verification.sql"
      - "store/queries/refresh.sql"
      - "store/queries/password.sql"
    schema: "store/schemas/schema.sql"
    gen:
      go:
        package: "gen"
        out: "store/gen"
        overrides:
          - column: "auth_users.credentials"
            go_type: "encoding/json.RawMessage"