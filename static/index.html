<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FIDO2 / WebAuthn Demo</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; }
  input { padding: 8px; width: 100%; box-sizing: border-box; margin-bottom: 8px; }
  button { padding: 8px 16px; margin-right: 8px; cursor: pointer; }
  #log { white-space: pre-wrap; background: #f4f4f4; padding: 12px; margin-top: 16px; min-height: 100px; border-radius: 4px; font-size: 14px; }
</style>
</head>
<body>
  <h1>FIDO2 / WebAuthn Demo</h1>
  <p>Requires HTTPS or <code>localhost</code>, and a browser with a platform authenticator or security key.</p>

  <input id="username" placeholder="username" value="testuser">
  <button onclick="register()">Register</button>
  <button onclick="login()">Login</button>

  <div id="log"></div>

<script>
function log(msg) {
  const el = document.getElementById('log');
  el.textContent += msg + "\n";
}

// --- base64url <-> ArrayBuffer helpers ---
function bufToBase64url(buf) {
  const bytes = new Uint8Array(buf);
  let str = '';
  for (const b of bytes) str += String.fromCharCode(b);
  return btoa(str).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

function base64urlToBuf(base64url) {
  let base64 = base64url.replace(/-/g, '+').replace(/_/g, '/');
  while (base64.length % 4) base64 += '=';
  const str = atob(base64);
  const bytes = new Uint8Array(str.length);
  for (let i = 0; i < str.length; i++) bytes[i] = str.charCodeAt(i);
  return bytes.buffer;
}

async function register() {
  const username = document.getElementById('username').value.trim();
  if (!username) return log('enter a username first');

  try {
    log('--- register: fetching options ---');
    const beginResp = await fetch(`/auth/fido/register/begin?email=${encodeURIComponent(username)}`);
    if (!beginResp.ok) return log('begin failed: ' + await beginResp.text());
    const options = await beginResp.json();
    console.log(JSON.stringify(options.publicKey, null, 2)); // <-- add this line

    const publicKey = options.publicKey;
    publicKey.challenge = base64urlToBuf(publicKey.challenge);
    publicKey.user.id = base64urlToBuf(publicKey.user.id);
    if (publicKey.excludeCredentials) {
      publicKey.excludeCredentials = publicKey.excludeCredentials.map(c => ({
        ...c,
        id: base64urlToBuf(c.id),
      }));
    }

    log('calling navigator.credentials.create() -- follow your browser/security key prompt');
    const cred = await navigator.credentials.create({ publicKey });

    const credentialJSON = {
      id: cred.id,
      rawId: bufToBase64url(cred.rawId),
      type: cred.type,
      response: {
        attestationObject: bufToBase64url(cred.response.attestationObject),
        clientDataJSON: bufToBase64url(cred.response.clientDataJSON),
      },
      clientExtensionResults: cred.getClientExtensionResults(),
    };

    const finishResp = await fetch(`/auth/fido/register/finish?email=${encodeURIComponent(username)}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(credentialJSON),
    });
    log('server says: ' + await finishResp.text());
  } catch (e) {
    log('error: ' + e);
  }
}

async function login() {
  const username = document.getElementById('username').value.trim();
  if (!username) return log('enter a username first');

  try {
    log('--- login: fetching options ---');
    const beginResp = await fetch(`/auth/fido/login/begin?email=${encodeURIComponent(username)}`);
    if (!beginResp.ok) return log('begin failed: ' + await beginResp.text());
    const options = await beginResp.json();

    const publicKey = options.publicKey;
    publicKey.challenge = base64urlToBuf(publicKey.challenge);
    if (publicKey.allowCredentials) {
      publicKey.allowCredentials = publicKey.allowCredentials.map(c => ({
        ...c,
        id: base64urlToBuf(c.id),
      }));
    }

    log('calling navigator.credentials.get() -- follow your browser/security key prompt');
    const cred = await navigator.credentials.get({ publicKey });

    const credentialJSON = {
      id: cred.id,
      rawId: bufToBase64url(cred.rawId),
      type: cred.type,
      response: {
        authenticatorData: bufToBase64url(cred.response.authenticatorData),
        clientDataJSON: bufToBase64url(cred.response.clientDataJSON),
        signature: bufToBase64url(cred.response.signature),
        userHandle: cred.response.userHandle ? bufToBase64url(cred.response.userHandle) : null,
      },
      clientExtensionResults: cred.getClientExtensionResults(),
    };

    const finishResp = await fetch(`/auth/fido/login/finish?email=${encodeURIComponent(username)}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(credentialJSON),
    });
    log('server says: ' + await finishResp.text());
  } catch (e) {
    log('error: ' + e);
  }
}
</script>
</body>
</html>
