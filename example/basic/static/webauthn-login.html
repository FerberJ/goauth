<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebAuthn Login</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Arial, sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #111827;
        color: #f9fafb;
      }

      .card {
        width: min(92vw, 520px);
        padding: 24px;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.08);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
      }

      h1 {
        margin-top: 0;
        font-size: 1.4rem;
      }

      label {
        display: block;
        margin-top: 12px;
        font-weight: 600;
      }

      input {
        width: 100%;
        margin-top: 6px;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid #6b7280;
        background: #fff;
        color: #111827;
      }

      button {
        margin-top: 16px;
        padding: 10px 14px;
        border: 0;
        border-radius: 8px;
        background: #10b981;
        color: #fff;
        cursor: pointer;
        font-weight: 600;
      }

      button:disabled {
        opacity: 0.7;
        cursor: wait;
      }

      .status {
        margin-top: 16px;
        padding: 12px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.08);
        white-space: pre-wrap;
      }

      .muted {
        color: #d1d5db;
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Sign in with a security key</h1>
      <p class="muted">Use this page to start a WebAuthn login flow.</p>

      <label for="email">Email</label>
      <input id="email" type="email" placeholder="user@example.com" required />

      <button id="loginBtn" type="button">Sign in</button>
      <div id="status" class="status">Waiting for input…</div>
    </main>

    <script>
      const loginBtn = document.getElementById('loginBtn');
      const emailInput = document.getElementById('email');
      const status = document.getElementById('status');

      function showStatus(message) {
        status.textContent = message;
      }

      function bufferToBase64url(buffer) {
        const bytes = new Uint8Array(buffer);
        let binary = '';
        for (let i = 0; i < bytes.byteLength; i += 1) {
          binary += String.fromCharCode(bytes[i]);
        }
        return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '');
      }

      function base64urlToBuffer(value) {
        if (!value) return new ArrayBuffer(0);
        if (value instanceof ArrayBuffer) return value;
        if (value instanceof Uint8Array) return value.buffer;
        if (Array.isArray(value)) return Uint8Array.from(value).buffer;

        let base64 = value.replace(/-/g, '+').replace(/_/g, '/');
        while (base64.length % 4 !== 0) {
          base64 += '=';
        }
        const binary = atob(base64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i += 1) {
          bytes[i] = binary.charCodeAt(i);
        }
        return bytes.buffer;
      }

      function convertOptions(options) {
        return {
          publicKey: {
            ...options,
            challenge: base64urlToBuffer(options.challenge),
            allowCredentials: (options.allowCredentials || []).map((cred) => ({
              ...cred,
              id: base64urlToBuffer(cred.id),
            })),
          },
        };
      }

      async function login() {
        const email = emailInput.value.trim();
        if (!email) {
          showStatus('Please enter an email address.');
          return;
        }

        loginBtn.disabled = true;
        showStatus('Starting sign-in…');

        try {
          const beginResponse = await fetch('/auth/fido-login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email }),
          });

          if (!beginResponse.ok) {
            throw new Error(`Sign-in begin failed: ${beginResponse.status}`);
          }

          const options = await beginResponse.json();
          const assertion = await navigator.credentials.get(convertOptions(options));

          const payload = {
            id: assertion.id,
            rawId: bufferToBase64url(assertion.rawId),
            type: assertion.type,
            response: {
              authenticatorData: bufferToBase64url(assertion.response.authenticatorData),
              clientDataJSON: bufferToBase64url(assertion.response.clientDataJSON),
              signature: bufferToBase64url(assertion.response.signature),
              userHandle: assertion.response.userHandle ? bufferToBase64url(assertion.response.userHandle) : null,
            },
          };

          const finishResponse = await fetch('/auth/fido-assert', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });

          if (!finishResponse.ok) {
            const text = await finishResponse.text();
            throw new Error(text || 'Sign-in failed');
          }

          showStatus('Signed in successfully.');
        } catch (error) {
          console.error(error);
          showStatus(error.message || 'Sign-in failed.');
        } finally {
          loginBtn.disabled = false;
        }
      }

      loginBtn.addEventListener('click', login);
    </script>
  </body>
</html>
